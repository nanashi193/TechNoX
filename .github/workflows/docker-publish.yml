name: Build & Push Docker Image

# Kịch bản này sẽ chạy khi nào?
on:
  push:
    branches: [ "main" ] # Chỉ chạy khi có code mới vào nhánh main
  pull_request:
     branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub sẽ cấp cho bạn 1 máy Ubuntu ảo để chạy

    steps:
      # 1. Tải code của bạn về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập vào Docker Hub (Dùng bí mật bạn vừa cài)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Cài đặt Docker Buildx (Công cụ build xịn sò)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build và Đẩy lên Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./shop/backend
          file: ./shop/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/technox-backend:latest