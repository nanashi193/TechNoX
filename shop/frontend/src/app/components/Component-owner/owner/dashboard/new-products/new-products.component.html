<div class="card new-products">
    <div class="card-header">
        <h3>Sản phẩm mới</h3>
        <a class="link" routerLink="/owner/products">Xem tất cả</a>
    </div>

    <ul>
        <li *ngFor="let p of newProducts">
            <img [ngSrc]="p.image" width="40" height="40" alt="{{p.name}}">
            <div class="info">
                <p class="name">{{ p.name }}</p>
                <span class="date">{{ p.date }}</span>
            </div>
        </li>
    </ul>
</div>
