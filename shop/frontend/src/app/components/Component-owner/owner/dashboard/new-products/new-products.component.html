<div class="card new-products">
    <div class="card-header">
        <h3>Sản phẩm mới</h3>
        <a class="link" routerLink="/owner/products">Xem tất cả</a>
    </div>

    <ul class="np-list">
        <li *ngFor="let p of newProducts; trackBy: track">
            <img [ngSrc]="p.image || placeholder" width="40" height="40" alt="{{p.name}}">
            <div class="info">
                <p class="name">{{ p.name }}</p>
                <span class="date">{{ p.date ? (p.date | date:'dd/MM/yyyy') : '—' }}</span>
            </div>
        </li>

        <a class="view" [routerLink]="['/owner/products', p.id]" aria-label="Xem chi tiết {{p.name}}">
            Xem chi tiết
        </a>

        <li *ngIf="!newProducts?.length" class="muted">Chưa có sản phẩm mới.</li>
    </ul>
</div>
