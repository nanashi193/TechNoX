<section class="selected">
    <div class="container">
        <p class="eyebrow">Danh mục</p>
        <h2 class="section-title" style="font-size:clamp(28px,6vw,44px)">Tất cả sản phẩm</h2>

        <div class="filter-grid">
            <input type="search" placeholder="Tìm kiếm..."
                   [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" />
            <select [(ngModel)]="categoryFilter" (ngModelChange)="onFilterChange()">
                <option *ngFor="let c of categories" [value]="c">{{ c === 'all' ? 'Tất cả' : c }}</option>
            </select>
            <select [(ngModel)]="sortKey" (ngModelChange)="onSortChange()">
                <option value="relevance">Mặc định</option>
                <option value="priceAsc">Giá tăng dần</option>
                <option value="priceDesc">Giá giảm dần</option>
                <option value="nameAsc">Tên A → Z</option>
            </select>
        </div>

        <div class="pager" *ngIf="!loading && totalPages > 1"> <button class="pager__btn" type="button" (click)="prevPage()" [disabled]="currentPage===1" aria-label="Trang trước">‹</button>
            <div class="pager__info">Trang {{currentPage}} / {{totalPages}}</div>
            <button class="pager__btn" type="button" (click)="nextPage()" [disabled]="currentPage===totalPages" aria-label="Trang sau">›</button>
        </div>

        <div #catalogGrid class="card-grid" *ngIf="!loading"> <article class="card" *ngFor="let p of products; trackBy: trackById">
            <a class="card__media"
               [routerLink]="['/product', p.id]" [ngStyle]="bgImg(p.image)"        aria-label="{{ p.name }}">       </a>

            <div class="card__body">
                <h3 class="card__title">
                    <a [routerLink]="['/product', p.id]">{{ p.name }}</a> </h3>

                <div>
                    <span class="price">{{ formatPrice(p.price) }}</span> <span *ngIf="!p.inStock" class="chip chip--oos">Hết hàng</span> </div>

                <button class="btn btn--accent btn--block" type="button" [disabled]="!p.inStock">
                    Thêm vào giỏ
                </button>
            </div>
        </article>
        </div>

        <div *ngIf="loading" class="loading-indicator">Đang tải...</div>
        <div *ngIf="!loading && products.length === 0" class="no-products">Không tìm thấy sản phẩm.</div>
    </div>
</section>
