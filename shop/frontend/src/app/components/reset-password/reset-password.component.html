<div class="auth-layout">
    <aside class="brand-pane">
        <a routerLink="/" class="logo-link" aria-label="Home"></a>
        <h1 class="brand-title">Đặt lại mật khẩu</h1>
        <p class="brand-note">Tạo mật khẩu mới mạnh mẽ hơn.</p>
    </aside>

    <main class="form-pane">
        <div class="card">
            <h2>Tạo mật khẩu mới</h2>

            <form *ngIf="!errorMsg && !successMsg; else messageArea"
                  [formGroup]="form" (ngSubmit)="onSubmit()">

                <p *ngIf="token; else invalidTokenMsg">Nhập mật khẩu mới cho tài khoản của bạn.</p>
                <ng-template #invalidTokenMsg>
                    <p class="error-text">Liên kết không hợp lệ.</p>
                </ng-template>

                <div class="field">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" placeholder="Ít nhất 8 ký tự" formControlName="newPassword"/>
                    <span class="error-text"
                          *ngIf="newPasswordCtrl?.touched && newPasswordCtrl?.hasError('required')">
                        Vui lòng nhập mật khẩu mới.
                    </span>
                    <span class="error-text"
                          *ngIf="newPasswordCtrl?.touched && newPasswordCtrl?.hasError('minlength')">
                        Mật khẩu phải có ít nhất 8 ký tự.
                    </span>
                </div>

                <div class="field">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" formControlName="confirmPassword"/>
                    <span class="error-text"
                          *ngIf="confirmPasswordCtrl?.touched && confirmPasswordCtrl?.hasError('required')">
                        Vui lòng xác nhận mật khẩu.
                    </span>
                    <span class="error-text"
                          *ngIf="form.touched && form.hasError('mismatch') && confirmPasswordCtrl?.dirty">
                        Mật khẩu không khớp.
                    </span>
                </div>

                <button type="submit" class="primary-btn" [disabled]="loading || form.invalid || !token">
                    {{ loading ? 'Đang cập nhật...' : 'Đặt lại mật khẩu' }}
                </button>
            </form>

            <ng-template #messageArea>
                <p class="alert success-text" *ngIf="successMsg">{{ successMsg }}</p>
                <p class="alert error-text" *ngIf="errorMsg">{{ errorMsg }}</p>
                <p *ngIf="successMsg || errorMsg">
                    <a routerLink="/login">Quay lại đăng nhập</a>
                </p>
            </ng-template>
        </div>
    </main>
</div>
