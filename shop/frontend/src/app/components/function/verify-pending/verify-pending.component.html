<div class="auth-layout">
    <aside class="brand-pane">
        <a routerLink="/" class="logo-link" aria-label="Home"></a>

        <h1 class="brand-title">
            Welcome<br/>to TechNoZ <br/>
        </h1>
        <p class="brand-note">Hướng đến tương lai cùng chúng tôi.</p>

        <div class="hotlines">
            <a href="tel:+245041660355">+245 04 166 0355</a>
            <a href="tel:+347423902456">+347 42 390 2456</a>
        </div>

        <div class="socials">
            <a aria-label="Facebook" href="#i">f</a>
            <a aria-label="Twitter/X" href="#i">t</a>
            <a aria-label="LinkedIn" href="#i">ln</a>
        </div>
    </aside>

    <main class="form-pane">
        <div class="card">
            <h2>Kiểm tra hộp thư</h2>
            <p class="description">Chúng tôi đã gửi email xác minh. Nếu chưa nhận được, bạn có thể gửi lại.</p>
            <p class="alert success" *ngIf="successMsg" role="status" aria-live="polite">{{ successMsg }}</p>
            <p class="alert error" *ngIf="errorMsg" role="alert" aria-live="assertive">{{ errorMsg }}</p>

            <form [formGroup]="form" (ngSubmit)="resend()" novalidate>
                <div class="field">
                    <input
                            type="email"
                            formControlName="email"
                            placeholder="Email đã đăng ký"
                            autocomplete="email"
                    />
                    <span class="error-text" *ngIf="emailCtrl.touched && emailCtrl.invalid">
            <ng-container *ngIf="emailCtrl.hasError('required')">Vui lòng nhập email.</ng-container>
            <ng-container *ngIf="emailCtrl.hasError('email')">Định dạng email chưa đúng.</ng-container>
          </span>
                </div>

                <button
                        class="primary-btn"
                        type="submit"
                        [disabled]="loading || form.invalid || cooldown > 0"
                        [attr.aria-busy]="loading ? 'true' : null">
                    <!-- Hiển thị đếm ngược -->
                    {{ cooldown > 0 ? ('Gửi lại sau ' + cooldown + 's') : (loading ? 'Đang gửi...' : 'Gửi lại email xác minh') }}
                </button>
            </form>
        </div>
    </main>
</div>
