<div class="auth-layout">
    <aside class="brand-pane">
        <a routerLink="/" class="logo-link" aria-label="Home"></a>

        <h1 class="brand-title">
            Welcome<br/>to TechNoX <br/>
        </h1>
        <p class="brand-note">Hướng đến tương lai cùng chúng tôi.</p>

        <div class="hotlines">
            <a href="tel:+245041660355">+245 04 166 0355</a>
            <a href="tel:+347423902456">+347 42 390 2456</a>
        </div>

        <div class="socials">
            <a aria-label="Facebook" href="#i">f</a>
            <a aria-label="Twitter/X" href="#i">t</a>
            <a aria-label="LinkedIn" href="#i">ln</a>
        </div>
    </aside>

    <main class="form-pane">
        <div class="card">
            <h2>Xác minh email</h2>
            <p *ngIf="loading">Đang xử lý...</p>

            <p class="alert success" *ngIf="!loading && successMsg">{{ successMsg }}</p>
            <p class="alert error" *ngIf="!loading && errorMsg">{{ errorMsg }}</p>

            <div *ngIf="!loading && successMsg" style="margin-top:12px">
                <a routerLink="/login" class="primary-btn" style="display:inline-block;text-align:center;">
                    Đăng nhập
                </a>
            </div>
        </div>
    </main>
</div>
