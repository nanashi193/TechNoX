<div class="auth-layout">
    <aside class="brand-pane">
        <a routerLink="/"
           class="logo-link" aria-label="Home"></a>

        <h1 class="brand-title">
            Welcome<br/>
            to TechNoX <br/>
        </h1>
        <p class="brand-note">Hướng đến tương lai cùng chúng tôi.</p>
        <div class="hotlines">
            <a href="tel:+245941660355">+245 04 166 0355</a>
            <a href="tel:+347423902456">+347 42 390 2456</a>
        </div>
        <div class="socials">
            <a aria-label="Facebook" href="#i">f</a>
            <a aria-label="Twitter/X" href="#i">t</a>
            <a aria-label="LinkedIn" href="#i">ln</a>
        </div>
    </aside>
    <main class="form-pane">
        <div class="card">
            <h2>Khôi phục mật khẩu</h2>
            <p>Nhập email bạn đã đăng ký với TechNoX.</p>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="field">
                    <input type="email" placeholder="Email" formControlName="email"/>
                    <span class="error-text"
                          *ngIf="emailCtrl.touched && emailCtrl.invalid && emailCtrl.hasError('pattern')">
                        Vui lòng nhập email hợp lệ.
                    </span>
                </div>

                <button type="submit" class="btn-primary" [disabled]="loading || form.invalid">
                    {{ loading ? 'Đang gửi...' : 'Khôi phục' }}
                </button>
            </form>

            <p class="alert" *ngIf="successMsg">{{ successMsg }}</p>
            <p class="alert error-text" *ngIf="errorMsg">{{ errorMsg }}</p>

            <p class="back-to-login">
                <a routerLink="/login">← Quay lại đăng nhập</a>
            </p>
        </div>
    </main>

</div>
