<div class="auth-layout">
    <aside class="brand-pane">
        <img class="brand-logo" ngSrc="assets/Pokecut_1759070674094.png" alt="Application" height="1200" width="1200"/>
        <h1 class="brand-title">
            Welcome<br/>
            to TechNoX <br/>
        </h1>
        <p class="brand-note">Đi đến tương lai cùng chúng tôi.
        <div class="hotlines">
            <a href="tel:+245941660355">+245 04 166 0355</a>
            <a href="tel:+347423902456">+347 42 390 2456</a>
        </div>
        <div class="socials">
            <a aria-label="Facebook" href="#i">f</a>
            <a aria-label="Twitter/X" href="#i">t</a>
            <a aria-label="LinkedIn" href="#i">ln</a>
        </div>
    </aside>

    <main class="form-pane">
        <div class="card">
            <h2>Đăng nhập</h2>
            <p class="description">
                Hãy cho chúng tôi biết bạn là ai.<br/>
            </p>

            <form (ngSubmit)="onSubmit()" #formRef="ngForm" novalidate>
                <input
                        type="text"
                        name="username"
                        [(ngModel)]="model.username"
                        placeholder="Tên đăng nhập"
                        required
                />
                <input
                        type="password"
                        name="password"
                        [(ngModel)]="model.password"
                        placeholder="Mật khẩu"
                        required
                        minlength="6"
                />

                <div class="remember-forgot">
                    <label>
                        <input
                                type="checkbox"
                                name="remember"
                                [(ngModel)]="model.remember"
                        />
                        Nhớ mật khẩu
                    </label>

                    <a href="#!" class="forgot-link" (click)="onForgotPassword()">Quên mật khẩu?</a>
                </div>


                <button
                        type="submit"
                        class="primary-btn"
                        [disabled]="isSubmitting"
                >
                    <span *ngIf="!isSubmitting">Sign in</span>
                    <span *ngIf="isSubmitting">Signing in...</span>
                </button>
            </form>

            <p class="no-account">
                Bạn chưa có tài khoản?
                <a routerLink="/signup" class="create-link">Đăng ký</a>
            </p>

        </div>
    </main>
</div>
