<section class="selected">
    <div class="container">
        <p class="eyebrow">Danh mục</p>
        <h2 class="section-title" style="font-size:clamp(28px,6vw,44px)">Tất cả sản phẩm</h2>

        <!-- FILTER BAR -->
        <div class="filter-grid" style="position:relative; z-index: 5;">
            <!-- Search -->
            <div class="field">
                <label for="q">Tìm kiếm</label>
                <input
                        id="q"
                        type="search"
                        placeholder="Tìm kiếm..."
                        [(ngModel)]="searchTerm"
                        (ngModelChange)="onSearch()"
                        class="control"
                        aria-label="Tìm kiếm sản phẩm"
                        autocomplete="off"
                />
            </div>

            <!-- Device filter -->
            <div class="field">
                <label for="deviceSelect">Thiết bị</label>
                <select
                        id="deviceSelect"
                        [(ngModel)]="deviceFilter"
                        (ngModelChange)="onDeviceFilterChange($event)"
                        class="control"
                        aria-label="Lọc theo thiết bị"
                >
                    <option value="all">Tất cả</option>
                    <option value="laptop">Laptop</option>
                    <option value="ipad">iPad</option>
                    <option value="phone">Điện thoại</option>
                </select>
            </div>

            <!-- Sort (FE-only by price) -->
            <div class="field">
                <label for="sortSelect">Sắp xếp</label>
                <select
                        id="sortSelect"
                        [(ngModel)]="sortKey"
                        (ngModelChange)="onSortChange()"
                        class="control"
                        aria-label="Sắp xếp"
                >
                    <option value="relevance">Mặc định</option>
                    <option value="priceAsc">Giá ↑ (tăng dần)</option>
                    <option value="priceDesc">Giá ↓ (giảm dần)</option>
                </select>
            </div>
        </div>

        <!-- PAGER -->
        <div class="pager" *ngIf="!loading && totalPages > 1">
            <button class="pager__btn" type="button" (click)="prevPage()" [disabled]="currentPage===1" aria-label="Trang trước">‹</button>
            <div class="pager__info">Trang {{currentPage}} / {{totalPages}}</div>
            <button class="pager__btn" type="button" (click)="nextPage()" [disabled]="currentPage===totalPages" aria-label="Trang sau">›</button>
        </div>

        <!-- GRID -->
        <div class="card-grid" *ngIf="!loading" style="position:relative; z-index: 1;">
            <article class="card" *ngFor="let p of products; trackBy: trackById">
                <a class="card__media" [routerLink]="['/product', p.id]" aria-label="{{ p.name }}">
                    <img
                            *ngIf="p.imageUrls?.length; else fallbackImg"
                            [src]="p.imageUrls[0]"
                            [alt]="p.name"
                            class="card__img"
                    />
                    <ng-template #fallbackImg>
                        <img
                                [src]="p.image || 'https://placehold.co/300x300/eee/ccc?text=No+Image'"
                                [alt]="p.name"
                                class="card__img"
                        />
                    </ng-template>
                </a>

                <div class="card__body">
                    <h3 class="card__title">
                        <a [routerLink]="['/product', p.id]">{{ p.name }}</a>
                    </h3>

                    <div>
                        <span class="price">{{ formatPrice(p.price) }}</span>
                        <span *ngIf="p.inStock === false" class="chip chip--oos">Hết hàng</span>
                    </div>

                    <button class="btn btn--accent btn--block" type="button" [disabled]="p.inStock === false">
                        Thêm vào giỏ
                    </button>
                </div>
            </article>
        </div>

        <div *ngIf="loading" class="loading-indicator">Đang tải...</div>
        <div *ngIf="!loading && products.length === 0" class="no-products">Không tìm thấy sản phẩm.</div>
    </div>
</section>
