<h1 class="h-page">Danh sách người dùng</h1>

<div class="toolbar">
    <input class="search" placeholder="Search users" [(ngModel)]="q" (ngModelChange)="onSearch()">

    <div class="right">
        <div class="bulk" *ngIf="selectedCount()">
            <span class="muted">{{ selectedCount() }} Selected</span>
            <button class="btn danger" (click)="bulk('delete')">Delete</button>
        </div>

        <button class="btn ghost" (click)="toggleFilters($event)">Filters</button>
    </div>
    <div class="sheet-backdrop" *ngIf="showFilters" (click)="closeFilters()"></div>

    <aside class="filters-sheet" [class.open]="showFilters" (click)="$event.stopPropagation()">
        <div class="sheet-header">
            <h3>Filters</h3>
            <button class="icon-btn" aria-label="Close" (click)="closeFilters()">×</button>
        </div>

        <div class="sheet-body">
            <div class="fp-group">
                <div class="fp-label">Active</div>
                <label class="fp-row"><input type="radio" name="act" [(ngModel)]="flt.activeFilter" value="all">
                    All</label>
                <label class="fp-row"><input type="radio" name="act" [(ngModel)]="flt.activeFilter" value="active">
                    Active</label>
                <label class="fp-row"><input type="radio" name="act" [(ngModel)]="flt.activeFilter" value="inactive">
                    Inactive</label>
            </div>

            <!-- chỗ này sau bạn thêm các nhóm filter khác -->
        </div>

        <div class="sheet-footer">
            <button class="btn ghost" (click)="clearFilters()">Clear all filters</button>
            <button class="btn primary" (click)="applyFilters()">Save</button>
        </div>
    </aside>
</div>

<div class="table users">
    <div class="row thead">
        <label class="cell check">
            <input type="checkbox"
                   [checked]="allSelected()"
                   [indeterminate]="someSelected()"
                   (change)="toggleAll($event)">
        </label>
        <div class="cell col-name th sortable" (click)="sortBy('name')" [attr.aria-sort]="ariaSort('name')">
            Tên <span class="sort-caret" [class.asc]="isAsc('name')" [class.desc]="isDesc('name')"
        ></span>
        </div>

        <div class="cell col-email th sortable" (click)="sortBy('email')" [attr.aria-sort]="ariaSort('email')">
            Email <span class="sort-caret" [class.asc]="isAsc('email')" [class.desc]="isDesc('email')"
        ></span>
        </div>

        <div class="cell col-phone th sortable" (click)="sortBy('phone')" [attr.aria-sort]="ariaSort('phone')">
            Số điện thoại <span class="sort-caret" [class.asc]="isAsc('phone')" [class.desc]="isDesc('phone')"
        ></span>
        </div>

        <div class="cell col-active th sortable" (click)="sortBy('isActive')" [attr.aria-sort]="ariaSort('isActive')">
            Hoạt động <span class="sort-caret" [class.asc]="isAsc('isActive')" [class.desc]="isDesc('isActive')"
        ></span>
        </div>

        <div class="cell col-orders th sortable" (click)="sortBy('ordersCount')"
             [attr.aria-sort]="ariaSort('ordersCount')">
            Số đơn hàng <span class="sort-caret" [class.asc]="isAsc('ordersCount')" [class.desc]="isDesc('ordersCount')"
        ></span>
        </div>

        <div class="cell col-spent th sortable" (click)="sortBy('totalSpent')"
             [attr.aria-sort]="ariaSort('totalSpent')">
            Tổng chi tiêu <span class="sort-caret" [class.asc]="isAsc('totalSpent')" [class.desc]="isDesc('totalSpent')"
                 ></span>
        </div>
    </div>

    <div class="row" *ngFor="let u of users; trackBy: trackById">
        <label class="cell check">
            <input type="checkbox" [checked]="isSelected(u.id)" (change)="toggle(u.id,$event)">
        </label>

        <div class="cell col-name">
            <div class="avatar sm">{{ u.FullName?.[0] | uppercase }}</div>
            <a class="name-link" [routerLink]="['/owner/users', u.id]">{{ u.FullName }}</a>
        </div>
        <div class="cell col-email">{{ u.email }}</div>
        <div class="cell col-phone">{{ u.PhoneNumber || '—' }}</div>
        <div class="cell col-active">
            <label class="switch">
                <input type="checkbox" [checked]="u.IsActive" (change)="toggleActive(u)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="cell col-orders">{{ u.stats.orders }}</div>
        <div class="cell col-spent">{{ u.stats.totalSpent | number:'1.0-0' }} ₫</div>
    </div>
</div>

<nav class="pagination" aria-label="Pagination">
    <button class="pg prev" [disabled]="page === 1" (click)="prev()">Trang trước</button>

    <ng-container *ngFor="let n of pages; let i = index">
        <ng-container *ngIf="i === 0 || n - pages[i-1] === 1; else dots">
            <button class="pg num" [class.active]="n===page" (click)="goto(n)">{{ n }}</button>
        </ng-container>
        <ng-template #dots>
            <span class="muted">…</span>
            <button class="pg num" [class.active]="n===page" (click)="goto(n)">{{ n }}</button>
        </ng-template>
    </ng-container>

    <button class="pg next" [disabled]="page === totalPages" (click)="next()">Trang sau</button>
</nav>
