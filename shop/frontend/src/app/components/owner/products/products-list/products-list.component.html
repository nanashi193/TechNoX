<div class="toolbar">
    <div class="search">
        <input type="text" placeholder="Search products" [(ngModel)]="q" (input)="onSearch()">
    </div>

    <button class="btn" (click)="create()">+ Add product</button>

    <div class="bulk" *ngIf="selectedCount()">
        <span class="muted">{{ selectedCount() }} Selected</span>
        <button class="btn danger" (click)="bulk('delete')">Delete</button>
        <button class="btn" (click)="bulk('archive')">Archive</button>
        <button class="btn" (click)="bulk('publish')">Publish</button>
        <button class="btn" (click)="bulk('unpublish')">Unpublish</button>
    </div>

    <div class="right">
        <button class="btn ghost">Filters</button>
    </div>
</div>

<div class="table">
    <div class="row thead">
        <label class="cell check">
            <input type="checkbox" [checked]="allSelected()" (change)="toggleAll($event)">
        </label>
        <div class="cell col-product">Product</div>
        <div class="cell col-type">Type</div>
        <div class="cell col-stocks">Stocks</div>
        <div class="cell col-sku">SKU</div>
        <div class="cell col-price">Price</div>
        <div class="cell col-variants">Variants</div>
        <div class="cell col-qty">Quantity</div>
        <div class="cell col-actions">Actions</div>
    </div>

    <div class="row" *ngFor="let p of filtered; trackBy: trackById">
        <label class="cell check">
            <input type="checkbox" [checked]="isSelected(p.id)" (change)="toggle(p.id,$event)">
        </label>

        <div class="cell col-product">
            <img class="thumb" [src]="p.image" alt="">
            <div class="info">
                <div class="name">{{ p.name }}</div>
                <div class="sku muted">#{{ p.sku }}</div>
            </div>
        </div>

        <div class="cell col-type"><span class="muted">{{ p.type }}</span></div>

        <div class="cell col-stocks">
            <label class="switch">
                <input type="checkbox" [checked]="p.inStock" (change)="toggleStock(p)">
                <span class="track"></span>
            </label>
        </div>

        <div class="cell col-sku">{{ p.sku }}</div>
        <div class="cell col-price">{{ p.price | currency:'USD':'symbol' }}</div>
        <div class="cell col-variants">{{ p.variants }}</div>
        <div class="cell col-qty">{{ p.stockQty ?? 0 }}</div>

        <!-- chỉ còn 8th cell: Actions -->
        <div class="cell col-actions">
            <button class="btn ghost sm" (click)="edit(p.id)">Edit</button>
            <button class="btn ghost icon" aria-label="More">⋯</button>
        </div>
    </div>

</div>

<nav class="pagination" aria-label="Pagination">
    <button class="pg prev" [disabled]="page === 1" (click)="prev()">Prev</button>

    <ng-container *ngFor="let n of pages; let i = index">
        <ng-container *ngIf="i === 0 || n - pages[i-1] === 1; else dots">
            <button class="pg num" [class.active]="n===page" (click)="goto(n)">{{n}}</button>
        </ng-container>
        <ng-template #dots>
            <span class="muted">…</span>
            <button class="pg num" [class.active]="n===page" (click)="goto(n)">{{n}}</button>
        </ng-template>
    </ng-container>

    <button class="pg next" [disabled]="page === totalPages" (click)="next()">Next</button>
</nav>
