<form [formGroup]="f" (ngSubmit)="save()" class="page">
    <!-- HEADER -->
    <div class="page-header">
        <a class="link" routerLink="/owner/products">← Quay lại danh sách</a>

        <div class="actions" [class.invisible]="editing">
            <button class="btn ghost" (click)="edit()">Chỉnh sửa</button>
        </div>

    </div>

    <div class="form-grid">
        <!-- LEFT: Product information -->
        <section class="card info-card">
            <h3 class="card-title">Thông tin sản phẩm</h3>

            <label class="field">
                <span>Tên <em class="req">*</em></span>
                <input type="text" formControlName="name" placeholder="iPhone" [readOnly]="!editing">
            </label>

            <div class="row-2">
                <label class="field">
                    <span>Mã sản phẩm</span>
                    <input type="text"
                           formControlName="sku"
                           placeholder="Sẽ tự sinh sau khi lưu"
                           readonly>
                </label>
            </div>

            <div class="field">
                <div class="label-row">
                    <span>Mô tả sản phẩm</span><span class="muted">(Tùy chọn)</span>
                </div>

                <textarea rows="8" placeholder="Type your description..."
                          formControlName="description" [readOnly]="!editing"></textarea>
            </div>
        </section>

        <!-- RIGHT: Pricing + Organization + Variants -->
        <div class="side">
            <section class="card">
                <h3 class="card-title">Giá (VND)</h3>

                <label class="field">
                    <span>Giá</span>
                    <ng-container *ngIf="!editing; else priceEdit">
                        {{ f.value.price | currency:'VND':'symbol-narrow':'1.0-0' }}
                    </ng-container>
                    <ng-template #priceEdit>
                        <input type="number" min="0" step="1" formControlName="price">
                    </ng-template>
                </label>

                <div class="field inline">
                    <span>Còn hàng</span>
                    <label class="switch">
                        <input type="checkbox" formControlName="inStock">
                        <span class="track"></span>
                    </label>
                </div>
            </section>

            <section class="card">
                <h3 class="card-title">Phân loại</h3>

                <label class="field">
                    <span>Loại</span>
                    <select formControlName="categoryId">
                        <option [ngValue]="null" disabled selected>Chọn danh mục…</option>
                        <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
                    </select>
                </label>
                <div class="error" *ngIf="f.controls.categoryId.touched && f.controls.categoryId.hasError('required')">
                    Vui lòng chọn danh mục.
                </div>
            </section>


            <section class="card variants-card">
                <h3 class="card-title">Biến thể</h3>

                <div class="v-grid" formArrayName="variants">
                    <div class="v-row v-head">
                        <div>Màu</div>
                        <div>Size</div>
                        <div>Tồn kho</div>
                        <div>Giá</div>
                        <div></div>
                    </div>

                    <!-- 1 dòng gồm 4 input -->
                    <div class="v-row" *ngFor="let _ of variantsFA.controls; let i = index" [formGroupName]="i">
                        <input class="v-td" formControlName="color" placeholder="Đen" [readOnly]="!editing">
                        <input class="v-td" formControlName="size"  placeholder="6.7 inch / 128GB" [readOnly]="!editing">
                        <input class="v-td" type="number" min="0" formControlName="quantity" [readOnly]="!editing">
                        <input class="v-td" type="number" min="0" formControlName="price"    [readOnly]="!editing">
                        <button type="button" class="icon-btn" (click)="removeVariant(i)" *ngIf="editing">🗑️</button>
                    </div>

                    <div class="muted" *ngIf="variantsFA.length === 0">Chưa có biến thể.</div>
                </div>

                <button type="button"
                        class="link"
                        (click)="addVariant({ color:'', size:'', quantity:0, price:0 })"
                        [disabled]="!editing">
                    + Thêm biến thể
                </button>
            </section>

        </div>

        <!-- MEDIA -->
        <section class="card media-card">
            <div class="card-head">
                <h3 class="card-title">Hình ảnh sản phẩm</h3>
                <div class="menu">
                    <button type="button" class="link" (click)="addMediaFromUrl()" *ngIf="editing">Thêm bằng URL ▾
                    </button>
                </div>
            </div>

            <div class="dropzone" [class.dragover]="dragOver" [class.readonly]="!editing"
                 (dragover)="editing && onDragOver($event)"
                 (dragleave)="editing && onDragLeave($event)"
                 (drop)="editing && onDrop($event)">

                <ng-container *ngIf="media.length === 0; else gallery">
                    <div class="dz-empty" *ngIf="editing">
                        <div class="box-illus"></div>
                        <div class="dz-title">Kéo và thả file ở đây</div>
                        <div class="muted">hoặc</div>
                        <button type="button" class="btn" (click)="fileInput.click()">Tải file lên</button>
                        <input #fileInput type="file" accept="image/*" multiple hidden (change)="onFileSelect($event)">
                    </div>
                    <div class="muted" *ngIf="!editing">Chưa có hình ảnh.</div>
                </ng-container>

                <ng-template #gallery>
                    <div class="media-grid">
                        <div class="media-item"
                             *ngFor="let m of media; index as i"
                             [class.is-thumb]="m.previewUrl === selectedThumb">

                            <img [src]="m.previewUrl" alt=""
                                 (click)="editing && setThumb(m)">


                            <!-- Nút xoá -->
                            <button type="button"
                                    class="remove"
                                    *ngIf="editing"
                                    (click)="onRemove(i, $event)"
                                    aria-label="Xoá ảnh">✕</button>

                            <span class="badge" *ngIf="m.previewUrl === selectedThumb">Ảnh đại diện</span>

                        </div>
                    </div>

                    <div class="media-actions" *ngIf="editing">
                        <button type="button" class="btn" (click)="fileInput.click()">Add more</button>
                        <input #fileInput type="file" accept="image/*" multiple hidden (change)="onFileSelect($event)">
                    </div>
                </ng-template>

            </div>
        </section>
    </div>

    <!-- Sticky action bar -->
    <div class="sticky-actions" *ngIf="showStickyBar">
            <button type="button" class="btn ghost" (click)="cancel()">Hủy</button>
            <button type="submit" class="btn primary" [disabled]="f.invalid || saving || !editing || !f.dirty">Lưu</button>
    </div>
</form>
