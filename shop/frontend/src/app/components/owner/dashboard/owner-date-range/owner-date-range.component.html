<button class="dr-btn" (click)="toggle($event)">
    <span class="icon ico-mask" style="--ico:url('assets/icons/calendar.svg')"></span>
    <span>{{ label() }}</span>
    <span class="chev">▾</span>
</button>

<div class="dr-menu" *ngIf="open" (click)="$event.stopPropagation()">
    <button class="item" [class.active]="active==='today'" (click)="pick('today')">Hôm nay</button>
    <button class="item" [class.active]="active==='yesterday'" (click)="pick('yesterday')">Hôm qua</button>
    <button class="item" [class.active]="active==='last7'" (click)="pick('last7')">7 ngày qua</button>
    <button class="item" [class.active]="active==='last30'" (click)="pick('last30')">30 ngày qua</button>
    <button class="item" [class.active]="active==='thisMonth'" (click)="pick('thisMonth')">Tháng này</button>
    <button class="item" [class.active]="active==='lastMonth'" (click)="pick('lastMonth')">Tháng trước</button>

    <div class="divider"></div>
    <button class="item" [class.active]="active==='custom'" (click)="pick('custom')">Tùy chọn</button>

    <div class="custom" *ngIf="showCustom">
        <div class="row">
            <label>Từ</label><input type="date" [(ngModel)]="customStart">
        </div>
        <div class="row">
            <label>Đến</label><input type="date" [(ngModel)]="customEnd">
        </div>
        <button class="apply" (click)="apply()">Áp dụng</button>
    </div>
</div>
