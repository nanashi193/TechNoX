<!-- HEADER -->
<header class="site-header">
    <div class="container header-inner">
        <button class="icon-btn" type="button" (click)="toggleMenu()" aria-label="Open menu">☰</button>

        <!-- LOGO -->
        <a class="brand" routerLink="/">
            <img
                    class="brand__logo"
                    src="assets/Phone/Logo.png"
                    alt="TechNoX"
                    width="200" height="40"
                    decoding="async" fetchpriority="high"
            />
            <span class="brand__name">TechNoX</span>
        </a>

        <div class="header-actions">
            <a class="link-auth" routerLink="/login">Đăng nhập</a>
            <a class="btn btn--accent btn-auth" routerLink="/signup">Đăng ký</a>
            <a class="cart" routerLink="/cart" aria-label="Giỏ hàng">giỏ hàng (0)</a>
        </div>
    </div>
</header>

<!-- MOBILE MENU -->
<nav class="mobile-menu" [class.open]="mobileMenuOpen" (click)="closeMenu()">
    <div class="mobile-menu__panel" (click)="$event.stopPropagation()">
        <button class="mobile-menu__close" type="button" (click)="closeMenu()">✕</button>
        <ul>
            <li><a routerLink="/shop" (click)="closeMenu()">Điện thoại</a></li>
            <li><a routerLink="/accessories" (click)="closeMenu()">Phụ kiện</a></li>
            <li><a routerLink="/deals" (click)="closeMenu()">Khuyến mãi</a></li>
            <li><a routerLink="/stores" (click)="closeMenu()">Cửa hàng</a></li>
            <li><a routerLink="/news" (click)="closeMenu()">Tin tức</a></li>
            <li><a routerLink="/about" (click)="closeMenu()">Về chúng tôi</a></li>
            <li class="divider"></li>
            <li><a routerLink="/login" (click)="closeMenu()">Đăng nhập</a></li>
            <li><a routerLink="/signup" (click)="closeMenu()">Đăng ký</a></li>
        </ul>
    </div>
</nav>
